<!DOCTYPE html>
<html lang="en">
<head>
    <title>아기사자 자기소개</title>
</head>
<body>  
    <div class="box">
        <div class="top"></div>
        <div class="bottom">
            <h1>
                고민성 (FE)
            </h1>
            <h2>
                "1학년 프론트엔드 완전정복이 목표!"
            </h2>
            <div class="container">
                    <a href="https://blog.naver.com/go991219" target="_blank" rel="noopener" class="item">블로그</a>

                    <a href="https://github.com/KMS-KR?tab=repositories" target="_blank" rel="noopener" class="item">깃허브</a>
            </div>
        </div>
        <div class="circle">
            <img src="./ae_1717974246479_720454_0.webp" alt="프로필">
        </div>
        <style>
            body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;  
            }
            .box{
                display: flex;
                flex-direction: column;
                border-radius: 30px;
                width: 400px;
                height: 500px;
                position: relative;
                overflow: hidden;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            }
            .top{
                flex: 0.8;
                background-color: #FF6000;
            }
            .bottom{
                flex: 1.2;
                background-color: white;
            }
            .bottom h1{
                text-align: center;
                padding-top: 100px;
                margin-bottom: 6px;
            }
            .bottom h2{
                text-align: center;
                padding-top: 0px;
                margin-top: 6px;
                color: rgb(188, 188, 188);
            }
            .circle{
                position: absolute;
                transform: translate(-50%,-50%);
                left: 50%;
                top: 40%;
                width: 120px;
                height: 120px;
                border-radius: 50%;
                border: 6px solid white;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                overflow: hidden;
            }
            .circle img{
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .container{
                display: flex;
                justify-content: center;
                gap: 25px;
                 margin-top: 20px;
            }
            .item{
                display: inline-block;
                background-color:rgb(226, 226, 226);
                border-radius: 20px;
                padding : 3px 15px;
                text-decoration: none;
                color: black;
            }
        </style>
    </div>
</body>
</html>
